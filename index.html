<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAAA Spilsamling</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>EAAA Spilsamling</h1>
    </header>

    <main>
        <section class="search-section">
            <h2>Find et spil</h2>
            <div class="search-bar">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Søg efter et spil..."
                    aria-label="Søg efter et spil"
                >
                <button type="button" id="searchButton">Søg</button>
            </div>
        </section>

        <img src="img/eaaa spilsamling baggrund.svg"
        class="baggrund"
        >
        


        <section class="filters">
            <h2>Filtrér spil</h2>

            <div class="filter-group">
                <h3>Genre</h3>
                <label><input type="checkbox" name="genre" value="Brætspil"> Brætspil</label>
                <label><input type="checkbox" name="genre" value="Kortspil"> Kortspil</label>
                <label><input type="checkbox" name="genre" value="Selskabsspil"> Selskabsspil</label>
                <label><input type="checkbox" name="genre" value="Strategi"> Strategi</label>
                <label><input type="checkbox" name="genre" value="Quiz"> Quiz</label>
                <label><input type="checkbox" name="genre" value="Terningespil"> Terningespil</label>
            </div>

            <div class="filter-group">
                <h3>Sværhedsgrad</h3>
                <label><input type="radio" name="difficulty" value="Alle" checked> Alle</label>
                <label><input type="radio" name="difficulty" value="Let"> Let</label>
                <label><input type="radio" name="difficulty" value="Medium"> Medium</label>
                <label><input type="radio" name="difficulty" value="Svært"> Svært</label>
            </div>

            <div class="filter-group">
                <h3>Maksimal spilletid</h3>
                <input
                    type="range"
                    id="playtimeFilter"
                    min="20"
                    max="180"
                    value="180"
                    step="10"
                >
                <p>Maks. <span id="playtimeValue">180</span> minutter</p>
            </div>
        </section>

        <section class="games-section">
            <div class="games-heading">
                <h2>Alle spil</h2>
                <select id="sortSelect" aria-label="Sortér spil">
                    <option value="title">Titel A-Å</option>
                    <option value="playtime">Korteste spilletid</option>
                    <option value="playtime-desc">Længste spilletid</option>
                </select>
            </div>

            <div id="gameList" class="game-grid"></div>
        </section>
    </main>

    <script src="js/games.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
